# GATv2 on the augmented graph with AMGPool; pretrained runs set
# --model.init_args.pretrained_checkpoint
class_path: chebai_graph.models.pretraining.GATAMGPoolGraphPredFromPretraining
init_args:
  optimizer_kwargs:
    lr: 1e-3
  config:
    in_channels: 203
    hidden_channels: 256
    out_channels: 512
    num_layers: 4
    edge_dim: 12
    heads: 8
    v2: True
    dropout: 0
  n_linear_layers: 1
