# GATv2 on the flat graph with sum pooling; pretrained runs set
# --model.init_args.pretrained_checkpoint
class_path: chebai_graph.models.pretraining.GATGraphPredFromPretraining
init_args:
  optimizer_kwargs:
    lr: 1e-3
  config:
    in_channels: 161
    hidden_channels: 256
    out_channels: 512
    num_layers: 4
    edge_dim: 8
    heads: 8
    v2: True
    dropout: 0
  n_linear_layers: 1
