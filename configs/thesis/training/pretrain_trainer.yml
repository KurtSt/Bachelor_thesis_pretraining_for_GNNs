# Self-supervised pretraining on the PubChem stream: one pass over the stream,
# validation every 2000 steps; checkpoints: latest.ckpt (resume), molecules_<n>.ckpt
# (data scaling) and final.ckpt (end of pretraining, transferred to fine-tuning)
max_epochs: 1
val_check_interval: 2000
check_val_every_n_epoch: 1
log_every_n_steps: 50
default_root_dir: logs
logger:
  class_path: lightning.pytorch.loggers.CSVLogger
  init_args:
    save_dir: logs
callbacks:
  # chebai keeps only the first logger, this restores e.g. the W&B logger
  - class_path: chebai_graph.callbacks.KeepAllLoggers
  - class_path: chebai.callbacks.model_checkpoint.CustomModelCheckpoint
    init_args:
      monitor: val_loss
      mode: min
      filename: 'best_{step}_{val_loss:.4f}'
      save_top_k: 1
      save_last: true
      every_n_train_steps: 2000
  # Written every 500 steps and when training stops, independent of validation;
  # resume an interrupted run with RESUME=<run>/checkpoints/latest.ckpt
  - class_path: chebai.callbacks.model_checkpoint.CustomModelCheckpoint
    init_args:
      filename: latest
      monitor: null
      save_top_k: 1
      every_n_train_steps: 500
      save_on_train_epoch_end: true
      enable_version_counter: false
  - class_path: chebai_graph.models.pretraining.callbacks.MoleculeMilestoneCheckpoint
    init_args:
      milestones: [1000000, 10000000, 100000000]
