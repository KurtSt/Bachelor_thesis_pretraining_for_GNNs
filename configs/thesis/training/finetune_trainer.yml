# Supervised training on ChEBI (all runs), checkpoints selected by validation macro-F1
min_epochs: 200
max_epochs: 200
accumulate_grad_batches: 4
default_root_dir: logs
logger:
  class_path: lightning.pytorch.loggers.CSVLogger
  init_args:
    save_dir: logs
callbacks:
  # chebai keeps only the first logger, this restores e.g. the W&B logger
  - class_path: chebai_graph.callbacks.KeepAllLoggers
  # probabilities, labels and identifiers of the test split, for the analyses per class
  - class_path: chebai_graph.callbacks.TestPredictionWriter
  - class_path: chebai.callbacks.model_checkpoint.CustomModelCheckpoint
    init_args:
      monitor: val_macro-f1
      mode: max
      filename: 'best_{epoch:02d}_{val_loss:.4f}_{val_macro-f1:.4f}_{val_micro-f1:.4f}'
      every_n_epochs: 1
      save_top_k: 1
      save_last: true
